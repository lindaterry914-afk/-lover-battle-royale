<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Killers of the Day — No-Download FPS V8</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050809;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#rotate{position:fixed;inset:0;z-index:50;background:#070b0d;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900;padding:30px}
#start{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:linear-gradient(#071014cc,#020405f7)}
.card{width:min(560px,90vw);padding:32px;border:1px solid #ffffff2d;background:#11191ce8;border-radius:18px;text-align:center;box-shadow:0 25px 90px #000}
h1{margin:0;font-size:42px;letter-spacing:2px}p{color:#cbd2d4;line-height:1.5}
#deploy{width:100%;padding:16px;border:0;border-radius:10px;background:#e7eded;color:#071012;font-size:18px;font-weight:900}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;text-shadow:0 2px 6px #000}
.title{font-weight:900;letter-spacing:1px}.stats{text-align:right;font-size:13px;line-height:1.5}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}.cross{}
#cross:before{width:2px;height:22px;left:10px}.cross{}
#cross:after{height:2px;width:22px;top:10px}
#health{position:absolute;left:18px;bottom:18px;width:210px;text-shadow:0 2px 5px #000}
.bar{height:12px;background:#182023;border:1px solid #728083;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:#e1e8e8}
.small{font-size:11px;margin-top:4px}
#weapon{position:absolute;right:22px;bottom:18px;text-align:right;text-shadow:0 2px 6px #000}.wn{font-weight:900;font-size:17px}.ammo{font-size:27px;font-weight:900}
#msg{position:absolute;left:50%;top:18%;transform:translateX(-50%);display:none;font-size:30px;font-weight:900;text-align:center;text-shadow:0 3px 10px #000;white-space:nowrap}
#mini{position:absolute;right:18px;top:74px;width:120px;height:120px;background:#0b1112dd;border:1px solid #ffffff55;border-radius:8px}
.btn{position:absolute;pointer-events:auto;border:1px solid #ffffff55;background:#141c1ecc;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 5px 18px #0008}
#fire{right:22px;bottom:100px;width:92px;height:92px}#ads{right:128px;bottom:86px;width:58px;height:58px;font-size:11px}#reload{right:34px;bottom:205px;width:58px;height:58px;font-size:10px}
#jump{right:112px;bottom:158px;width:52px;height:52px;font-size:10px}
#joy{position:absolute;left:24px;bottom:28px;width:130px;height:130px;border-radius:50%;background:#ffffff10;border:1px solid #ffffff40;pointer-events:auto}
#stick{position:absolute;left:35px;top:35px;width:58px;height:58px;border-radius:50%;background:#ffffff30;border:1px solid #ffffff66}
@media (orientation:portrait){#rotate{display:flex}}
@media (orientation:landscape){#rotate{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rotate">Turn your phone sideways to play Killers of the Day.</div>
<div id="start"><div class="card"><h1>KILLERS OF THE DAY</h1><p>MOBILE FPS<br>Original soldiers • tactical map • first-person rifle • enemy AI • no external downloads</p><button id="deploy">DEPLOY</button></div></div>
<div id="hud">
 <div class="top"><div class="title">KILLERS OF THE DAY</div><div class="stats">ALIVE <b id="alive">12</b><br>KILLS <b id="kills">0</b><br>MODE <b>BR</b></div></div>
 <div id="mini"><canvas id="mc" width="120" height="120"></canvas></div>
 <div id="cross"></div><div id="msg"></div>
 <div id="health"><div class="bar"><div class="fill" id="hp"></div></div><div class="small">HP 100 • ARMOR 50</div></div>
 <div id="weapon"><div class="wn">KOD-7 TACTICAL</div><div class="ammo"><span id="mag">30</span> / 120</div></div>
</div>
<div id="joy"><div id="stick"></div></div>
<div class="btn" id="fire">FIRE</div><div class="btn" id="ads">ADS</div><div class="btn" id="reload">RELOAD</div><div class="btn" id="jump">JUMP</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),miniCanvas=document.getElementById('mc'),mc=miniCanvas?miniCanvas.getContext('2d'):null;
let W,H,D,started=false,over=false,last=0,ads=false,fire=false,reloading=false,lookId=null,lastLook=0;
const FOV=Math.PI/2.7;
const p={x:0,y:0,a:0,z:0,hp:100,mag:30,res:120,kills:0};
const keys={};let jx=0,jy=0;
let enemies=[],buildings=[],trees=[],tracers=[],muzzle=0;

function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();

function reset(){
 p.x=0;p.y=0;p.a=0;p.z=0;p.hp=100;p.mag=30;p.res=120;p.kills=0;over=false;
 enemies=[];buildings=[];trees=[];tracers=[];
 for(let i=0;i<11;i++) enemies.push({x:(Math.random()*2-1)*650,y:(Math.random()*2-1)*650,hp:100,alive:true,a:0,t:Math.random()*10});
 for(let i=0;i<18;i++) buildings.push({x:(Math.random()*2-1)*850,y:(Math.random()*2-1)*850,w:70+Math.random()*110,h:70+Math.random()*110});
 for(let i=0;i<45;i++) trees.push({x:(Math.random()*2-1)*900,y:(Math.random()*2-1)*900,s:.7+Math.random()*.7});
}
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function distance(x,y){return Math.hypot(x-p.x,y-p.y)}
function proj(x,y){
 let dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy),a=norm(Math.atan2(dy,dx)-p.a);
 if(d<8||Math.abs(a)>FOV/2)return null;
 return {d,a,sx:W/2+(a/(FOV/2))*W/2};
}
function blocked(x1,y1,x2,y2){
 let dx=x2-x1,dy=y2-y1,n=Math.ceil(Math.hypot(dx,dy)/18);
 for(let i=1;i<n;i++){let t=i/n,x=x1+dx*t,y=y1+dy*t;
  for(const b of buildings)if(x>b.x-b.w/2&&x<b.x+b.w/2&&y>b.y-b.h/2&&y<b.y+b.h/2)return true;
 }
 return false;
}
function world(){
 let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#172328');sky.addColorStop(.48,'#52605f');sky.addColorStop(.49,'#27302e');sky.addColorStop(1,'#0b1010');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // distant city
 for(let i=0;i<20;i++){let x=i*W/19,b=20+(i%4)*15,h=25+(i%5)*14;ctx.fillStyle='#182123';ctx.fillRect(x,H*.43-h,b,h)}
 // ground grid
 ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;
 for(let i=1;i<15;i++){let y=H*.5+Math.pow(i/15,1.8)*H*.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let i=-9;i<=9;i++){ctx.beginPath();ctx.moveTo(W/2+i*40,H*.5);ctx.lineTo(W/2+i*170,H);ctx.stroke()}
}
function building(b){
 let pr=proj(b.x,b.y);if(!pr)return;let s=Math.min(2.5,500/pr.d),w=b.w*s,h=b.h*s;
 ctx.save();ctx.translate(pr.sx,H*.51);ctx.fillStyle='#4b5656';ctx.fillRect(-w/2,-h,w,h);
 ctx.fillStyle='#6b7776';ctx.fillRect(-w/2,-h,w,7);
 ctx.fillStyle='#252e2f';for(let i=0;i<3;i++)for(let j=0;j<2;j++)ctx.fillRect(-w*.35+i*w*.25,-h*.75+j*h*.28,w*.12,h*.1);
 ctx.restore();
}
function tree(t){
 let pr=proj(t.x,t.y);if(!pr)return;let s=Math.min(2.4,360/pr.d)*t.s,base=H*.52;
 ctx.fillStyle='#111817';ctx.fillRect(pr.sx-4*s,base-55*s,8*s,55*s);
 ctx.fillStyle='#243b30';ctx.beginPath();ctx.arc(pr.sx,base-68*s,31*s,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#31523e';ctx.beginPath();ctx.arc(pr.sx-12*s,base-78*s,19*s,0,Math.PI*2);ctx.arc(pr.sx+15*s,base-74*s,21*s,0,Math.PI*2);ctx.fill();
}
function soldier(e){
 if(!e.alive)return;let pr=proj(e.x,e.y);if(!pr||blocked(p.x,p.y,e.x,e.y))return;
 let s=Math.min(2.9,480/pr.d),x=pr.sx,base=H*.53,head=18*s,body=54*s;
 // shadow
 ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(x,base+5,30*s,9*s,0,0,Math.PI*2);ctx.fill();
 // boots/legs
 ctx.strokeStyle='#111618';ctx.lineWidth=13*s;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x-9*s,base);ctx.lineTo(x-15*s,base+45*s);ctx.moveTo(x+9*s,base);ctx.lineTo(x+15*s,base+45*s);ctx.stroke();
 // torso armor
 ctx.fillStyle='#38474a';ctx.fillRect(x-24*s,base-body,48*s,body);
 ctx.fillStyle='#182224';ctx.fillRect(x-19*s,base-body+8*s,38*s,28*s);
 ctx.fillStyle='#687577';ctx.fillRect(x-12*s,base-body+13*s,8*s,5*s);ctx.fillRect(x+4*s,base-body+13*s,8*s,5*s);
 // arms
 ctx.strokeStyle='#303b3d';ctx.lineWidth=11*s;ctx.beginPath();ctx.moveTo(x-20*s,base-body+15*s);ctx.lineTo(x-36*s,base-body+38*s);ctx.moveTo(x+20*s,base-body+15*s);ctx.lineTo(x+35*s,base-body+36*s);ctx.stroke();
 // neck + head
 ctx.fillStyle='#8f6b58';ctx.fillRect(x-6*s,base-body-4*s,12*s,10*s);
 ctx.beginPath();ctx.arc(x,base-body-head*.7,head,0,Math.PI*2);ctx.fill();
 // helmet
 ctx.fillStyle='#182123';ctx.beginPath();ctx.arc(x,base-body-head,head*1.1,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle='#617174';ctx.fillRect(x-head*.7,base-body-head*.75,head*1.4,head*.3);
 // rifle
 ctx.strokeStyle='#0a0e0f';ctx.lineWidth=7*s;ctx.beginPath();ctx.moveTo(x+22*s,base-body+28*s);ctx.lineTo(x+60*s,base-body+38*s);ctx.stroke();
 // name/health
 ctx.textAlign='center';ctx.font=`bold ${Math.max(9,10*s)}px Arial`;ctx.fillStyle='#fff';ctx.fillText('RIVAL',x,base-body-head*1.5);
 ctx.fillStyle='#000c';ctx.fillRect(x-28*s,base-body-head*1.32,56*s,5);ctx.fillStyle='#e6eeee';ctx.fillRect(x-28*s,base-body-head*1.32,56*s*(e.hp/100),5);
}
function gun(){
 let sway=Math.sin(performance.now()/150)*1.7*(ads?.3:1),x=W*.72,y=H*.91;
 ctx.save();ctx.translate(x+sway,y);ctx.rotate(-.05);
 // hands
 ctx.fillStyle='#8c6857';ctx.beginPath();ctx.arc(-55,10,17,0,Math.PI*2);ctx.arc(28,0,15,0,Math.PI*2);ctx.fill();
 // rifle body
 ctx.fillStyle='#171d1f';ctx.fillRect(-45,-90,155,32);ctx.fillStyle='#4b5557';ctx.fillRect(15,-105,70,17);
 ctx.fillStyle='#0a0d0e';ctx.fillRect(75,-108,55,8);ctx.fillStyle='#343e40';ctx.fillRect(-8,-62,40,70);
 ctx.restore();
 if(muzzle>0){ctx.globalAlpha=muzzle;ctx.fillStyle='#fff4aa';ctx.beginPath();ctx.moveTo(W*.86,H*.78);ctx.lineTo(W*.95,H*.72);ctx.lineTo(W*.89,H*.82);ctx.lineTo(W*.98,H*.85);ctx.closePath();ctx.fill();ctx.globalAlpha=1}
}
function shoot(){
 if(!started||over||reloading)return;
 if(p.mag<=0){reload();return}
 p.mag--;document.getElementById('mag').textContent=p.mag;muzzle=.16;
 let best=null,score=9999;
 for(const e of enemies){if(!e.alive)continue;let q=proj(e.x,e.y);if(!q||blocked(p.x,p.y,e.x,e.y))continue;
  let s=Math.abs(q.sx-W/2)/(ads?55:90)+q.d/1500;if(s<score){score=s;best=e}
 }
 if(best&&score<1){best.hp-=ads?60:42;if(best.hp<=0){best.alive=false;p.kills++;document.getElementById('kills').textContent=p.kills}}
}
function reload(){if(reloading||p.mag===30||p.res<=0)return;reloading=true;setTimeout(()=>{let n=Math.min(30-p.mag,p.res);p.mag+=n;p.res-=n;reloading=false;document.getElementById('mag').textContent=p.mag},900)}
function update(dt){
 if(!started||over)return;
 let mx=(keys.a?-1:0)+(keys.d?1:0),my=(keys.w?1:0)+(keys.s?-1:0);if(jx||jy){mx=jx;my=jy}
 let sp=190*dt*(ads?.55:1),nx=p.x+Math.cos(p.a)*my*sp+Math.cos(p.a+Math.PI/2)*mx*sp,ny=p.y+Math.sin(p.a)*my*sp+Math.sin(p.a+Math.PI/2)*mx*sp;
 if(!blocked(p.x,p.y,nx,ny)){p.x=nx;p.y=ny}
 for(const e of enemies)if(e.alive){e.t+=dt;let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);if(d<500&&!blocked(e.x,e.y,p.x,p.y)){e.x+=dx/d*dt*22;e.y+=dy/d*dt*22;if(d<250&&Math.random()<dt*.22)p.hp-=4}else{e.x+=Math.cos(e.t)*dt*9;e.y+=Math.sin(e.t*.7)*dt*9}}
 if(fire)shoot();muzzle=Math.max(0,muzzle-dt*3);
 document.getElementById('alive').textContent=1+enemies.filter(e=>e.alive).length;document.getElementById('hp').style.width=Math.max(0,p.hp)+'%';
 if(p.hp<=0){over=true;show('ELIMINATED')}
 if(enemies.every(e=>!e.alive)){over=true;show('VICTORY')}
}
function show(t){let m=document.getElementById('msg');m.textContent=t+' — RELOAD PAGE TO PLAY AGAIN';m.style.display='block'}
function mini(){
 if(!mc)return;
 mc.clearRect(0,0,120,120);mc.fillStyle='#0b1112';mc.fillRect(0,0,120,120);const sc=.065;
 mc.strokeStyle='#ffffff18';mc.strokeRect(8,8,104,104);
 for(const b of buildings){mc.fillStyle='#697575';mc.fillRect(60+b.x*sc-2,60+b.y*sc-2,4,4)}
 for(const e of enemies)if(e.alive){mc.fillStyle='#e5eeee';mc.beginPath();mc.arc(60+e.x*sc,60+e.y*sc,2,0,Math.PI*2);mc.fill()}
 mc.fillStyle='#fff';mc.beginPath();mc.arc(60,60,3,0,Math.PI*2);mc.fill();mc.strokeStyle='#fff';mc.beginPath();mc.moveTo(60,60);mc.lineTo(60+Math.cos(p.a)*15,60+Math.sin(p.a)*15);mc.stroke();
}
function render(){world();let objs=[...buildings.map(x=>({o:x,t:0})),...trees.map(x=>({o:x,t:1})),...enemies.map(x=>({o:x,t:2}))].filter(q=>q.t<2||q.o.alive).sort((a,b)=>distance(b.o.x,b.o.y)-distance(a.o.x,a.o.y));for(const q of objs){if(q.t===0)building(q.o);else if(q.t===1)tree(q.o);else soldier(q.o)}gun();mini()}
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);

document.getElementById('deploy').onclick=()=>{document.getElementById('start').style.display='none';started=true;reset()};
document.getElementById('fire').onpointerdown=()=>fire=true;document.getElementById('fire').onpointerup=()=>fire=false;document.getElementById('fire').onpointercancel=()=>fire=false;
document.getElementById('ads').onpointerdown=()=>ads=true;document.getElementById('ads').onpointerup=()=>ads=false;document.getElementById('ads').onpointercancel=()=>ads=false;
document.getElementById('reload').onclick=reload;document.getElementById('jump').onclick=()=>{p.x+=Math.cos(p.a)*28;p.y+=Math.sin(p.a)*28};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')shoot();if(e.key.toLowerCase()==='r')reload();if(e.key.toLowerCase()==='q')ads=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key.toLowerCase()==='q')ads=false});
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let jp=false;
function moveJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.min(45,Math.hypot(x,y)),a=Math.atan2(y,x);jx=Math.cos(a)*m/45;jy=-Math.sin(a)*m/45;stick.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`}
joy.onpointerdown=e=>{jp=true;joy.setPointerCapture(e.pointerId);moveJoy(e)};joy.onpointermove=e=>{if(jp)moveJoy(e)};joy.onpointerup=()=>{jp=false;jx=jy=0;stick.style.transform='translate(0,0)'};
c.onpointerdown=e=>{if(e.clientX>W*.38&&e.clientY<H*.82){lookId=e.pointerId;lastLook=e.clientX}};c.onpointermove=e=>{if(e.pointerId===lookId){p.a+=(e.clientX-lastLook)*.006;lastLook=e.clientX}};c.onpointerup=e=>{if(e.pointerId===lookId)lookId=null};
</script>
</body>
</html>
