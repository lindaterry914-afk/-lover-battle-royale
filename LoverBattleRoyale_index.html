<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Killers of the Day — Realistic Mobile FPS V7</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.5) 100%)}
#score{position:absolute;top:13px;left:16px;font-weight:900;font-size:27px}
#mode{font-size:12px;letter-spacing:1px}
#timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-weight:900;background:#101820bb;padding:6px 18px;border-radius:5px}
#map{position:absolute;right:13px;top:12px;width:132px;height:132px;border:2px solid #ffffff88;border-radius:4px;background:#1c2930dd}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px}
#status{position:absolute;left:22px;bottom:24px;width:210px;font-weight:800}
.bar{height:11px;border:1px solid #ffffff66;background:#111c;border-radius:6px;overflow:hidden}.fill{height:100%;background:#eee;width:100%}
#weapon{position:absolute;right:22px;bottom:28px;text-align:right;font-weight:800}
#ammo{font-size:31px}
.btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border:2px solid #ffffff55;background:#0d1317aa;border-radius:50%;font-weight:900;user-select:none}
#fire{right:18px;bottom:96px;width:108px;height:108px}
#aim{right:132px;bottom:229px;width:66px;height:66px}
#reload{right:22px;bottom:224px;width:66px;height:66px}
#jump{right:126px;bottom:70px;width:66px;height:66px}
#crouch{right:39px;bottom:222px;width:66px;height:66px}
#joy{position:absolute;left:20px;bottom:28px;width:138px;height:138px;border-radius:50%;border:2px solid #ffffff44;background:#1118;pointer-events:auto}
#knob{position:absolute;left:41px;top:41px;width:55px;height:55px;border-radius:50%;background:#ffffff55}
#toast{position:absolute;left:50%;top:19%;transform:translateX(-50%);font-size:24px;font-weight:900;text-align:center;letter-spacing:1px}#hitmarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;opacity:0}#damageFlash{position:absolute;inset:0;background:rgba(255,0,0,.25);opacity:0}#reloadBar{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);width:170px;height:7px;background:#111b;border:1px solid #fff5;border-radius:8px;display:none;overflow:hidden}#reloadFill{height:100%;width:0;background:#ffd400}.small{font-size:12px}
#start{position:fixed;inset:0;z-index:10;background:linear-gradient(#071018dd,#0b1014ee);display:flex;align-items:center;justify-content:center;flex-direction:column}
#start h1{font-size:38px;margin:0 0 5px}.sub{text-align:center;max-width:330px;line-height:1.4;opacity:.8;margin:0 20px 24px}
#start button{border:0;border-radius:6px;background:#f3d500;padding:16px 42px;font-size:22px;font-weight:900}
</style>
</head>
<body>
<div id="start"><h1>KILLERS OF THE DAY</h1><p class="sub">Real-time 3D mobile FPS • original characters, weapons and map</p><button id="play">PLAY</button></div>
<div id="hud">
<div id="vignette"></div><div id="score"><span id="teamScore">0 — 0</span><div id="mode">KILLERS OF THE DAY • TEAM DEATHMATCH</div></div>
<div id="timer">05:00</div><canvas id="map" width="132" height="132"></canvas>
<div id="cross">+</div><div id="toast"></div><div id="hitmarker">×</div><div id="damageFlash"></div><div id="reloadBar"><div id="reloadFill"></div></div>
<div id="status">HP<div class="bar"><div class="fill" id="hp"></div></div></div>
<div id="weapon"><span id="weaponName">ASSAULT RIFLE</span><br><span id="ammo">30</span> / <span id="reserve">120</span></div>
<div id="joy"><div id="knob"></div></div>
<div class="btn" id="fire">FIRE</div><div class="btn small" id="sprint">RUN</div><div class="btn" id="aim">AIM</div><div class="btn" id="reload">↻</div><div class="btn" id="jump">↑</div><div class="btn" id="crouch">⌄</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ca1a0);
scene.fog=new THREE.FogExp2(0x71817e,.010);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,180);
cam.position.set(0,1.72,10);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd8e8ed,0x33442f,1.55));
const sun=new THREE.DirectionalLight(0xffdfb5,2.4);sun.position.set(-35,55,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);

function M(c,rough=.8,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function addBox(x,y,z,w,h,d,c,rough=.8){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,rough));q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;scene.add(q);return q}
const ground=addBox(0,-.35,0,180,.7,180,0x536a4e,1);

function building(x,z,w,d,h){
 const base=addBox(x,h/2,z,w,h,d,0x655f57);
 for(let side of [-1,1]){
   for(let i=-1;i<=1;i++){let win=addBox(x+i*(w/3.1),h*.62,z+side*(d/2+.012),2.1,1.05,.06,0x18252a,.35);win.material.emissive=new THREE.Color(0x071015)}
 }
 addBox(x,h+.12,z,w+.35,.25,d+.35,0x403c37);
}
building(0,-28,22,12,8);building(-25,-6,13,20,7);building(25,-5,15,18,7);building(-7,22,16,10,6);building(25,23,11,11,6);
function crate(x,z,s=1){addBox(x,s*.5,z,s,s,s,0x76563b);addBox(x,s*.53,z,s*.92,.08,.12,0x9b744a)}
for(const p of [[-10,-14,1.4],[10,-12,1.2],[-16,8,1.1],[15,10,1.5],[2,15,1.2]])crate(...p);
function vehicle(x,z){const v=addBox(x,1.1,z,3.4,1.4,6,0x20262a,.5);addBox(x,1.9,z-1.0,2.6,.8,2.5,0x151a1d,.35);for(const sx of [-1,1])for(const zz of [-1.8,1.8]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,16),M(0x0c0d0e,.45));w.rotation.z=Math.PI/2;w.position.set(x+sx*1.75,.55,z+zz);scene.add(w)}}
vehicle(-3,-2);vehicle(18,-22);


function tree(x,z){
 let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.55,4.3,8),M(0x4a3628));trunk.position.set(x,2,z);trunk.castShadow=true;scene.add(trunk);
 for(let i=0;i<3;i++){let crown=new THREE.Mesh(new THREE.SphereGeometry(2.5-i*.25,10,8),M(0x294f2c));crown.position.set(x+(Math.random()-.5)*1.3,4.8+i*.55,z+(Math.random()-.5)*1.3);crown.castShadow=true;scene.add(crown)}
}
for(let i=0;i<42;i++){let a=Math.random()*Math.PI*2,r=31+Math.random()*50;tree(Math.cos(a)*r,Math.sin(a)*r-16)}

function soldier(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);
 g.userData.phase=Math.random()*Math.PI*2;
 g.userData.moving=false;
 g.userData.parts={arms:[],legs:[],rifle:null};
 const skin=M(0xb98268,.72), skin2=M(0x9d674f,.78), uniform=M(0x39464b,.88), dark=M(0x171e22,.72), armor=M(0x29363b,.65), boot=M(0x12171a,.55), visorMat=M(0x071114,.22,.35);

 // torso / tactical vest
 let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.72,6,12),uniform);
 torso.scale.set(1,.98,.62);torso.position.y=1.28;torso.castShadow=true;g.add(torso);
 let vest=new THREE.Mesh(new THREE.BoxGeometry(.72,.66,.18),armor);
 vest.position.set(0,1.42,-.29);vest.castShadow=true;g.add(vest);
 // neck
 let neck=new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,.22,10),skin2);
 neck.position.y=1.88;g.add(neck);
 // head, ears, nose, jaw
 let head=new THREE.Mesh(new THREE.SphereGeometry(.35,20,14),skin);
 head.scale.set(.88,1.05,.92);head.position.y=2.25;head.castShadow=true;g.add(head);
 let ear1=new THREE.Mesh(new THREE.SphereGeometry(.065,10,8),skin);ear1.position.set(-.33,2.27,0);g.add(ear1);
 let ear2=ear1.clone();ear2.position.x=.33;g.add(ear2);
 let nose=new THREE.Mesh(new THREE.ConeGeometry(.055,.14,8),skin2);
 nose.rotation.x=Math.PI/2;nose.position.set(0,2.25,-.35);g.add(nose);
 // hair + helmet
 let hair=new THREE.Mesh(new THREE.SphereGeometry(.37,18,9),dark);
 hair.scale.set(.98,.48,.96);hair.position.set(0,2.49,.015);g.add(hair);
 let helmet=new THREE.Mesh(new THREE.SphereGeometry(.41,18,10),dark);
 helmet.scale.set(1,.58,1);helmet.position.set(0,2.53,.02);helmet.castShadow=true;g.add(helmet);
 let visor=new THREE.Mesh(new THREE.BoxGeometry(.43,.09,.055),visorMat);
 visor.position.set(0,2.34,-.34);g.add(visor);
 // eyes
 const eyeMat=M(0x15110f,.5);
 for(const sx of [-.12,.12]){
   let eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),eyeMat);
   eye.position.set(sx,2.30,-.335);g.add(eye);
 }
 // arms
 for(const sx of [-1,1]){
   let upper=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.42,5,8),uniform);
   upper.position.set(sx*.48,1.48,-.02);upper.rotation.z=sx>0?-0.28:0.28;upper.castShadow=true;g.add(upper);
   let fore=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.38,5,8),skin2);
   fore.position.set(sx*.55,1.18,-.18);fore.rotation.z=sx>0?-0.35:0.35;g.add(fore);g.userData.parts.arms.push(fore);
 }
 // legs + boots
 for(const sx of [-.23,.23]){
   let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.72,5,8),uniform);
   leg.position.set(sx,.62,0);leg.castShadow=true;g.add(leg);g.userData.parts.legs.push(leg);
   let b=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,.48),boot);
   b.position.set(sx,.14,-.11);b.castShadow=true;g.add(b);
 }
 // rifle held across the chest
 let rifle=new THREE.Group();
 let rb=new THREE.Mesh(new THREE.BoxGeometry(.14,.15,1.35),M(0x101315,.35,.35));
 rb.position.z=-.42;rifle.add(rb);
 let rr=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.85,10),M(0x5b6265,.28,.65));
 rr.rotation.x=Math.PI/2;rr.position.z=-1.42;rifle.add(rr);
 rifle.position.set(.34,1.43,-.42);rifle.rotation.x=Math.PI/2;rifle.rotation.y=-.15;g.add(rifle);g.userData.parts.rifle=rifle;

 scene.add(g);return g;
}
let enemies=[];
for(let i=0;i<8;i++) enemies.push({g:soldier((Math.random()-.5)*62,-15-Math.random()*60),hp:100,alive:true,shot:Math.random()*2});

function makeGun(){
 const g=new THREE.Group();
 const black=M(0x101417,.35,.45),blue=M(0x214a66,.28,.55),metal=M(0x59636a,.25,.7);
 let body=new THREE.Mesh(new THREE.BoxGeometry(.48,.38,1.7),black);body.position.z=-.25;g.add(body);
 let upper=new THREE.Mesh(new THREE.BoxGeometry(.34,.25,1.55),blue);upper.position.set(0,.2,-.3);g.add(upper);
 let barrel=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.2,12),metal);barrel.rotation.x=Math.PI/2;barrel.position.z=-1.55;g.add(barrel);
 let sight=new THREE.Mesh(new THREE.BoxGeometry(.12,.18,.45),black);sight.position.set(0,.38,-.45);g.add(sight);
 let grip=new THREE.Mesh(new THREE.BoxGeometry(.18,.55,.3),black);grip.position.set(0,-.43,.15);grip.rotation.x=-.15;g.add(grip);
 let mag=new THREE.Mesh(new THREE.BoxGeometry(.25,.65,.3),black);mag.position.set(0,-.38,-.2);mag.rotation.x=-.15;g.add(mag);
 let hand1=new THREE.Mesh(new THREE.BoxGeometry(.23,.18,.45),M(0x6b4939));hand1.position.set(-.25,-.32,-.45);g.add(hand1);
 let hand2=hand1.clone();hand2.position.set(.25,-.25,.15);g.add(hand2);
 g.position.set(.53,-.5,-1.05);g.rotation.y=-.07;g.rotation.x=-.04;cam.add(g);
 return g;
}
scene.add(cam);const gun=makeGun();

let started=false,ended=false,hp=100,ammo=30,reserve=120,kills=0,deaths=0,reloadT=0,yaw=0,pitch=0,aim=false,crouched=false,sprinting=false,matchTime=300,fireHeld=false,fireCooldown=0,hitFade=0,enemyShots=0;
let jx=0,jy=0,drag=false;
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
function jm(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),lim=48;if(m>lim){dx*=lim/m;dy*=lim/m}jx=dx/lim;jy=dy/lim;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{drag=true;joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=e=>drag&&jm(e);joy.onpointerup=()=>{drag=false;jx=jy=0;knob.style.transform=''};
function showHit(){const h=document.getElementById('hitmarker');h.style.opacity='1';clearTimeout(showHit.t);showHit.t=setTimeout(()=>h.style.opacity='0',90)}
function muzzle(){const flash=new THREE.Mesh(new THREE.ConeGeometry(.12,.45,8),new THREE.MeshBasicMaterial({color:0xffd15a,transparent:true,opacity:.95}));flash.rotation.x=Math.PI/2;flash.position.set(.53,-.5,-2.18);cam.add(flash);setTimeout(()=>cam.remove(flash),55)}
function shoot(){
 if(!started||ended||reloadT>0||ammo<=0)return;
 ammo--;muzzle();
 let best=null,bd=999;
 for(const e of enemies){
  if(!e.alive)continue;
  const dx=e.g.position.x-cam.position.x,dz=e.g.position.z-cam.position.z,d=Math.hypot(dx,dz);
  let a=Math.atan2(dx,dz)-yaw;
  a=Math.abs(Math.atan2(Math.sin(a),Math.cos(a)));
  if(a<.085&&d<70&&d<bd){best=e;bd=d;}
 }
 if(best){
  const crit=Math.random()<.22;
  best.hp-=crit?100:50;
  showHit();
  gun.position.z+=.08;gun.rotation.x+=.045;
  setTimeout(()=>{gun.position.z-=.08;gun.rotation.x-=.045},70);
  if(best.hp<=0){
   best.alive=false;best.g.visible=false;kills++;
   document.getElementById('teamScore').textContent=kills+' — 0';
   document.getElementById('toast').textContent=crit?'HEADSHOT':'ELIMINATION';
   setTimeout(()=>document.getElementById('toast').textContent='',700);
   if(kills===8){ended=true;document.getElementById('toast').textContent='VICTORY — MATCH WON';}
  }
 }
}
function reload(){if(ammo<30&&reserve>0&&reloadT<=0){reloadT=1.25;document.getElementById('reloadBar').style.display='block';gun.rotation.x=.35;}}
fire.onpointerdown=()=>{fireHeld=true;shoot()};fire.onpointerup=()=>fireHeld=false;fire.onpointercancel=()=>fireHeld=false;document.getElementById('sprint').onpointerdown=()=>sprinting=true;document.getElementById('sprint').onpointerup=()=>sprinting=false;
document.getElementById('reload').onpointerdown=reload;
document.getElementById('aim').onpointerdown=()=>{aim=true;cam.fov=47;cam.updateProjectionMatrix();gun.position.set(.12,-.38,-.78)};
document.getElementById('aim').onpointerup=()=>{aim=false;cam.fov=70;cam.updateProjectionMatrix();gun.position.set(.53,-.5,-1.05)};
document.getElementById('crouch').onpointerdown=()=>{crouched=!crouched;cam.position.y=crouched?1.2:1.72};
document.getElementById('jump').onpointerdown=()=>{let old=cam.position.y;cam.position.y=2.45;setTimeout(()=>cam.position.y=old,300)};
document.getElementById('play').onclick=()=>{started=true;start.style.display='none';toast.textContent='MATCH STARTED';setTimeout(()=>toast.textContent='',1500)};


function animateSoldier(e,dt,moving){
 const g=e.g;if(!g.visible)return;
 const parts=g.userData.parts;
 g.userData.phase+=(moving?dt*9:dt*2);
 const s=Math.sin(g.userData.phase), c=Math.cos(g.userData.phase);
 const stride=moving?s*.48:0;
 if(parts.legs.length>=2){
   parts.legs[0].rotation.x=stride;
   parts.legs[1].rotation.x=-stride;
 }
 if(parts.arms.length>=4){
   parts.arms[0].rotation.x=-stride*.55;
   parts.arms[1].rotation.x=stride*.55;
   parts.arms[2].rotation.x=-stride*.35;
   parts.arms[3].rotation.x=stride*.35;
 }
 g.position.y=moving?Math.abs(c)*.035:0;
 if(parts.rifle) parts.rifle.rotation.z=moving?c*.035:0;
}
function update(dt){
 if(!started||ended)return;
 if(reloadT>0){reloadT-=dt;document.getElementById('reloadFill').style.width=((1.25-reloadT)/1.25*100)+'%';if(reloadT<=0){const need=30-ammo;const take=Math.min(need,reserve);ammo+=take;reserve-=take;document.getElementById('reloadBar').style.display='none';document.getElementById('reloadFill').style.width='0%';gun.rotation.x=aim?-0.02:-.04}}
 matchTime=Math.max(0,matchTime-dt);document.getElementById('timer').textContent=new Date(matchTime*1000).toISOString().slice(14,19);if(matchTime<=0){ended=true;document.getElementById('toast').textContent='TIME UP';}
 if(fireHeld && fireCooldown<=0){shoot();fireCooldown=.105} fireCooldown=Math.max(0,fireCooldown-dt); if(hitFade>0){hitFade-=dt;document.getElementById('damageFlash').style.opacity=Math.min(1,hitFade*3)} const sp=7*(aim?.45:1)*(crouched?.48:1)*(sprinting?1.45:1);
 const kx=(keys['KeyD']?1:0)-(keys['KeyA']?1:0),ky=(keys['KeyW']?1:0)-(keys['KeyS']?1:0);const usingKeys=(Math.abs(kx)+Math.abs(ky)>0);const mx=usingKeys?kx:jx,my=usingKeys?ky:jy;const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 cam.position.addScaledVector(r,mx*sp*dt);cam.position.addScaledVector(f,my*sp*dt);
 for(const e of enemies)if(e.alive){
  let dx=cam.position.x-e.g.position.x,dz=cam.position.z-e.g.position.z,d=Math.hypot(dx,dz);
  if(d>5){e.g.position.x+=dx/d*dt*1.15;e.g.position.z+=dz/d*dt*1.15;e.g.rotation.y=Math.atan2(dx,dz);animateSoldier(e,dt,true)}
  else{animateSoldier(e,dt,false);e.shot-=dt;if(e.shot<=0){e.shot=1.3+Math.random();hp=Math.max(0,hp-6);hitFade=.25;document.getElementById('hp').style.width=hp+'%';if(hp<=0){deaths++;ended=true;toast.textContent='ELIMINATED'}}}
 }
 document.getElementById('ammo').textContent=ammo;document.getElementById('reserve').textContent=reserve;
}
function minimap(){
 let m=document.getElementById('map').getContext('2d');m.clearRect(0,0,132,132);m.fillStyle='#2b3a40';m.fillRect(0,0,132,132);
 m.strokeStyle='#9ba9ad66';for(let i=0;i<5;i++)m.strokeRect(10+i*23,14+(i%2)*18,27,18);
 m.fillStyle='#3fe4ff';m.beginPath();m.arc(66,66,4,0,7);m.fill();
 m.fillStyle='#ff4e4e';for(const e of enemies)if(e.alive){let dx=(e.g.position.x-cam.position.x)*1.2,dz=(e.g.position.z-cam.position.z)*1.2;if(Math.abs(dx)<58&&Math.abs(dz)<58)m.fillRect(66+dx,66+dz,4,4)}
}

const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='Space')document.getElementById('jump').dispatchEvent(new PointerEvent('pointerdown'));if(e.code==='ShiftLeft')sprinting=true});addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='ShiftLeft')sprinting=false});
addEventListener('mousemove',e=>{if(!started)return;yaw-=e.movementX*.0025;pitch=Math.max(-.35,Math.min(.35,pitch-e.movementY*.0018));cam.rotation.set(pitch,yaw,0)});
let lookStart=null;addEventListener('pointerdown',e=>{if(e.target===renderer.domElement)lookStart={x:e.clientX,y:e.clientY}});addEventListener('pointermove',e=>{if(!started||!lookStart)return; if(e.target===renderer.domElement){yaw-=(e.clientX-lookStart.x)*.004;pitch=Math.max(-.35,Math.min(.35,pitch-(e.clientY-lookStart.y)*.003));cam.rotation.set(pitch,yaw,0);lookStart={x:e.clientX,y:e.clientY}}});addEventListener('pointerup',()=>lookStart=null);
let last=performance.now();
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);minimap();renderer.render(scene,cam);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
